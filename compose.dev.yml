# Development container — live reload via bind-mounted source.
# Secrets: optional, loaded on the host from the gitignored ./.env.local by
# scripts/with-env.sh (plain KEY=value, or 1Password op:// refs via `op run`)
# and passed through by name below. All are optional.
#
# Usage: npm run dev:docker
services:
  tokenhop-dev:
    # Full (non-slim) image ships python3/make/g++ so better-sqlite3's node-gyp build succeeds.
    image: node:22-bookworm
    container_name: tokenhop-dev
    working_dir: /app
    ports:
      - "20127:20127"
    environment:
      NODE_ENV: development
      PORT: "20127"
      HOSTNAME: "0.0.0.0"
      DATA_DIR: /app/data
      HEADROOM_URL: http://headroom:8787
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_EXIT_TIMEOUT_MS: "5000"
      # Bind mounts on some hosts (macOS/Windows) don't propagate fs events.
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
      CLAUDE_CLI_VERSION: 2.1.280
      CLAUDE_CLI_SDK_VERSION: 0.112.1
      CLAUDE_CLI_RUNTIME_VERSION: v26.3.0
      CODEX_CLI_VERSION: 0.160.0
      GROK_CLI_VERSION: 1.0.44
      NEXT_PUBLIC_BRAND: tokenhop
      # Passed through from the host env (see header).
      GEMINI_OAUTH_CLIENT_ID: ${GEMINI_OAUTH_CLIENT_ID:-}
      GEMINI_OAUTH_CLIENT_SECRET: ${GEMINI_OAUTH_CLIENT_SECRET:-}
      ANTIGRAVITY_OAUTH_CLIENT_ID: ${ANTIGRAVITY_OAUTH_CLIENT_ID:-}
      ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
      META_CODE_OAUTH_CLIENT_ID: ${META_CODE_OAUTH_CLIENT_ID:-}
      TOKENHOP_MULTI_USER: on
      TOKENHOP_OWNER_EMAIL: ${TOKENHOP_OWNER_EMAIL:-}
    volumes:
      - .:/app
      - tokenhop-dev-node-modules:/app/node_modules
      # Keep container build cache off the host checkout (avoids root-owned .next).
      - tokenhop-dev-next:/app/.next
      - tokenhop-dev-data:/app/data
    # init reaps zombies and forwards SIGTERM; exec drops the sh wrapper so the
    # next binary gets the signal directly (bypasses npm shell chain) and can
    # release the DATA_DIR writer lock. stop_grace_period + NEXT_EXIT_TIMEOUT_MS
    # give the dev worker time to finish flush on stop.
    init: true
    stop_grace_period: 15s
    # npm ci keeps the mounted checkout reproducible.
    command: sh -c "npm ci && exec node node_modules/next/dist/bin/next dev --port 20127 --hostname 0.0.0.0"
    depends_on:
      - headroom

  # Sidecar for the Headroom token-saver integration. No code changes needed here;
  # it exists so dev changes can be verified against the Headroom proxy path.
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom-dev
    environment:
      # Never send Headroom telemetry or update checks.
      HEADROOM_TELEMETRY: "off"
      HEADROOM_UPDATE_CHECK: "off"
      DO_NOT_TRACK: "1"
    ports:
      - "8787:8787"

volumes:
  tokenhop-dev-node-modules:
    name: tokenhop-dev-node-modules
  tokenhop-dev-next:
    name: tokenhop-dev-next
  tokenhop-dev-data:
    name: tokenhop-dev-data

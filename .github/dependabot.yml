version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/tests", "/cli"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # undici 8 dispatchers break with Node 22/24's built-in fetch
      # ("invalid onRequestStart method"); see closed PR #28.
      - dependency-name: undici
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

name: CI

on:
  pull_request:
  push:
    branches: [master, re-design]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: Tests (vs known-fails baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      # Tests import from src/ and open-sse/, so root deps are required too.
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: tests
      # vitest to JSON, then the known-fails regression gate decides (see the root `test` script).
      - name: Tests + regression gate
        run: npm test
      - name: Provider registry baseline
        run: node tests/__baseline__/verify-providers.mjs
      - name: Alias baseline
        run: node tests/__baseline__/verify-alias.mjs
      - name: OAuth URL baseline
        run: node tests/__baseline__/verify-oauth-urls.mjs

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  cli:
    name: CLI package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # cli/ has no lockfile; --ignore-scripts skips its postinstall, which provisions ~/.9router.
      - run: npm --prefix cli install --no-audit --no-fund --no-package-lock --ignore-scripts
      - run: npm run cli:pack

  # Standalone rather than a workflow_call of docker-publish.yml, which would need
  # packages: write on PR runs.
  docker:
    name: Docker build (linux/amd64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          # Keep in sync with docker-publish.yml; the Dockerfile defaults to CN mirrors.
          build-args: |
            APK_MIRROR=dl-cdn.alpinelinux.org
            NPM_REGISTRY=https://registry.npmjs.org
          # Shares the publish cache scope; never reuse its secret-bearing OAuth layer.
          no-cache-filters: oauth-defaults
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
          provenance: false
          sbom: false

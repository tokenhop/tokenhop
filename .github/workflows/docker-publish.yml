name: Docker Image

# Pushing a v* tag builds and pushes ghcr.io/<owner>/<repo>:
#   :<version> and :<major>.<minor> from the tag (e.g. v1.2.3 → 1.2.3, 1.2)
#   :latest    only when the tag is the highest stable vX.Y.Z tag in the repo
#   :sha-<sha>
# Nothing runs on branch pushes. Manual runs build the chosen ref without pushing
# unless `push` is checked.
#
# Brand (NEXT_PUBLIC_BRAND build arg): v1+ tags, including v1.0.0-beta.N, build
# tokenhop; v0.* tags keep the default brand. Manual runs use the `brand` input.
#
# Each platform builds natively on its own runner (arm64 on ubuntu-24.04-arm, free
# for public repos), pushed by digest; `merge` then tags one multi-arch manifest.
# Building arm64 under QEMU instead took ~12 min per build and could hang
# silently in `npm install`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR (tagged by branch and sha only, never :latest)
        type: boolean
        default: false
      brand:
        description: Brand to build (`default` follows the brand module's default)
        type: choice
        options: [default, tokenhop]
        default: default

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUSH: ${{ github.event_name == 'push' || inputs.push }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # A native build takes a few minutes; fail a stalled one instead of waiting
    # for the 6h job default.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      # Empty means the brand module's default (see the header comment).
      - name: Resolve brand
        id: brand
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_BRAND: ${{ inputs.brand }}
        run: |
          brand=""
          if [ "$EVENT" = "push" ]; then
            major="${TAG#v}"
            major="${major%%.*}"
            if [ "$major" -ge 1 ] 2>/dev/null; then brand=tokenhop; fi
          elif [ "$INPUT_BRAND" != "default" ]; then
            brand="$INPUT_BRAND"
          fi
          echo "brand: ${brand:-default}"
          echo "value=${brand}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only; tags are applied to the manifest list in `merge`.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        # Built-in Google OAuth defaults, passed as BuildKit secrets (see Dockerfile).
        env:
          GEMINI_OAUTH_CLIENT_ID: ${{ secrets.GEMINI_OAUTH_CLIENT_ID }}
          GEMINI_OAUTH_CLIENT_SECRET: ${{ secrets.GEMINI_OAUTH_CLIENT_SECRET }}
          ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_ID }}
          ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
          META_CODE_OAUTH_CLIENT_ID: ${{ secrets.META_CODE_OAUTH_CLIENT_ID }}
        with:
          secret-envs: |
            GEMINI_OAUTH_CLIENT_ID=GEMINI_OAUTH_CLIENT_ID
            GEMINI_OAUTH_CLIENT_SECRET=GEMINI_OAUTH_CLIENT_SECRET
            ANTIGRAVITY_OAUTH_CLIENT_ID=ANTIGRAVITY_OAUTH_CLIENT_ID
            ANTIGRAVITY_OAUTH_CLIENT_SECRET=ANTIGRAVITY_OAUTH_CLIENT_SECRET
            META_CODE_OAUTH_CLIENT_ID=META_CODE_OAUTH_CLIENT_ID
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile defaults to CN mirrors; hosted runners use the upstream registries.
          build-args: |
            APK_MIRROR=dl-cdn.alpinelinux.org
            NPM_REGISTRY=https://registry.npmjs.org
            REQUIRE_OAUTH_DEFAULTS=1
            NEXT_PUBLIC_BRAND=${{ steps.brand.outputs.value }}
          # Cache keys ignore secret values; never reuse the OAuth-defaults layer.
          no-cache-filters: oauth-defaults
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          provenance: false
          sbom: false

      - name: Export digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name == 'push' || inputs.push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to find the highest version below

      # Tag :latest only when this tag is the highest stable vX.Y.Z tag, so
      # prereleases (v1.3.0-rc.1) and older-version backports never move it.
      - name: Resolve latest tag
        id: latest
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          highest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          echo "highest stable tag: ${highest:-none}; this tag: ${TAG}"
          echo "is_latest=$([ "$highest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest == 'true' }}
            type=ref,event=branch
            type=sha

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
